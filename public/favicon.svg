<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Base Badge -->
  <rect width="64" height="64" rx="16" fill="#0F172A"/>
  
  <!-- Outer Search Radar Ring (Subtle) -->
  <circle cx="32" cy="32" r="23" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 3" stroke-opacity="0.45"/>
  
  <!-- Crosshair Reticle Ticks -->
  <path d="M32 5V12M32 52V59M5 32H12M52 32H59" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Mid Range Coordinate Ring -->
  <circle cx="32" cy="32" r="14" stroke="#94A3B8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Pulse Core (LKS Beacon) -->
  <circle cx="32" cy="32" r="8" fill="#F59E0B" fill-opacity="0.3"/>
  <circle cx="32" cy="32" r="5" fill="#F59E0B"/>
  <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
